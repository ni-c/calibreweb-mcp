name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:coverage

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC token for npm Trusted Publishing — no NPM_TOKEN secret involved.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 24 ships npm >= 11.5.1, which Trusted Publishing requires.
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check that the tag matches the package version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi
      # --ignore-scripts: this job holds an OIDC token for npm Trusted
      # Publishing, and an install hook of any dependency would run while it is
      # available. Nothing in this tree needs one (`npm query
      # ':attr(scripts,[postinstall])'` and its install/preinstall siblings are
      # empty), and `npm publish` does not need node_modules built by hooks.
      - run: npm ci --ignore-scripts
      # --provenance requires a PUBLIC repository.
      - run: npm publish --provenance

  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for MCP registry OIDC authentication.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sync version from package.json into server.json
        run: |
          version="$(node -p "require('./package.json').version")"
          # The registry rejects a 'version' field on OCI packages — their version
          # lives in the identifier tag instead. Touch BOTH package entries.
          jq --arg v "$version" \
            '.version = $v
             | (.packages[] | select(.registryType != "oci") | .version) = $v
             | (.packages[] | select(.registryType == "oci")) |= (del(.version) | .identifier |= sub(":[^:]*$"; ":" + $v))' \
            server.json > server.tmp && mv server.tmp server.json
          jq -r '.packages[] | "\(.registryType) \(.identifier) \(.version // "-")"' server.json
      # ci.yml pushes the image in a parallel run on the same tag, so the registry's
      # ownership check would race it. Wait until GHCR actually serves the tag.
      - name: Wait for the GHCR image tag
        run: |
          version="$(node -p "require('./package.json').version")"
          token="$(curl -fsS 'https://ghcr.io/token?scope=repository:ni-c/calibreweb-mcp:pull&service=ghcr.io' | jq -r .token)"
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null -H "Authorization: Bearer $token" \
                -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
                "https://ghcr.io/v2/ni-c/calibreweb-mcp/manifests/$version"; then
              echo "ghcr.io/ni-c/calibreweb-mcp:$version is available"
              exit 0
            fi
            echo "waiting for ghcr.io/ni-c/calibreweb-mcp:$version ($i/60)"
            sleep 30
          done
          echo "Image tag $version never appeared on GHCR — is ci.yml's publish job green?" >&2
          exit 1
      - name: Install mcp-publisher
        run: |
          version=v1.8.1
          case "$(uname -m)" in
            x86_64) arch=amd64; sha=a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc ;;
            aarch64) arch=arm64; sha=8dd75a6cf6845688b5d4e46df58d3ca26d5c8d233bb0626606e1db82c5e883e4 ;;
            *) echo "unsupported architecture $(uname -m)" >&2; exit 1 ;;
          esac
          # Pinned to a tag with its published checksum: this job holds an OIDC
          # token, and `releases/latest/download` runs whatever upstream serves
          # on the day of the release.
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/$version/mcp-publisher_linux_$arch.tar.gz"
          echo "$sha  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          rm mcp-publisher.tar.gz
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" \
            '$0 ~ "^## \\[" ver "\\]" {flag=1; next} /^## \[/ {flag=0} flag' \
            CHANGELOG.md > release-notes.md
          if ! [ -s release-notes.md ]; then
            echo "No CHANGELOG section found for $version" >&2
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
